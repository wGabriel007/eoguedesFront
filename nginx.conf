# Um domínio só: o Nginx entrega o site e repassa /api e /midias para a API .NET.
# Vantagens: sem CORS, cookies/links simples e um único certificado HTTPS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  types { application/manifest+json webmanifest; }
  include /etc/nginx/mime.types;
  index index.html;

  client_max_body_size 320m;   # upload de vídeo pelo painel

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/   { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; proxy_request_buffering off; }
  location /midias/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; proxy_request_buffering off; expires 1y; }
  location = /saude { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; proxy_request_buffering off; }

  # Arquivos com hash no nome: cache de 1 ano
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /demo/   { expires 7d; try_files $uri =404; }

  # SPA: qualquer outra rota (/admin, /admin/fotos...) cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
